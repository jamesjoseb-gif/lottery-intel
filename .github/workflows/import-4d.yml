name: Import 4D results

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: true
        default: "2008-01-01"
        type: string
      to:
        description: "Inclusive end date (YYYY-MM-DD)"
        required: true
        default: "2024-07-26"
        type: string
      resume_year:
        description: "Optional year to resume from (YYYY); earlier years are skipped"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: import-4d
  cancel-in-progress: false

jobs:
  import-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKFILL_FROM: ${{ inputs.from }}
      BACKFILL_TO: ${{ inputs.to }}
      RESUME_YEAR: ${{ inputs.resume_year }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test importer and integrity rules
        run: npm test

      - name: Import and verify yearly batches
        run: npm run backfill:4d
