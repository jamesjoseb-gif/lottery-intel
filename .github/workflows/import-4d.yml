name: Import 4D results

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test importer and integrity rules
        run: npm test

      - name: Capture Singapore Pools draw HTML
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          curl --location --fail --silent --show-error \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" \
            "https://www.singaporepools.com.sg/DataFileArchive/Lottery/Output/fourd_result_draw_5514.html" \
            --output diagnostics/fourd_result_draw_5514.html
          wc -c diagnostics/fourd_result_draw_5514.html || true

      - name: Import 4D results
        run: npm run import:4d
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload parser diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singapore-pools-4d-html
          path: diagnostics/*.html
          if-no-files-found: warn
          retention-days: 7
