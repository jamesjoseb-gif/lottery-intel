name: Import 4D results

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: false
        type: string
      to:
        description: "Inclusive end date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # 20:30 and 22:30 Singapore time on normal 4D draw days.
    # The second run is a safe retry because imports are idempotent.
    - cron: "30 12 * * 3,6,0"
    - cron: "30 14 * * 3,6,0"

permissions:
  contents: read

concurrency:
  group: import-4d
  cancel-in-progress: false

jobs:
  import-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test importer and integrity rules
        run: npm test

      - name: Resolve import date range
        shell: bash
        run: |
          SGT_TODAY=$(TZ=Asia/Singapore date +%F)
          FROM="${{ inputs.from }}"
          TO="${{ inputs.to }}"
          echo "IMPORT_FROM=${FROM:-$SGT_TODAY}" >> "$GITHUB_ENV"
          echo "IMPORT_TO=${TO:-$SGT_TODAY}" >> "$GITHUB_ENV"

      - name: Verify official live sources
        run: npm run verify:live

      - name: Import 4D results
        run: npm run import:4d

      - name: Verify 4D database integrity
        run: npm run verify:4d
