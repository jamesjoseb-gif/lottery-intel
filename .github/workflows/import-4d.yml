name: Import 4D results

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Inclusive start date (YYYY-MM-DD; max 370 days)"
        required: true
        type: string
      to:
        description: "Inclusive end date (YYYY-MM-DD; max 370 days)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: import-4d
  cancel-in-progress: false

jobs:
  import-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMPORT_FROM: ${{ inputs.from }}
      IMPORT_TO: ${{ inputs.to }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test importer and integrity rules
        run: npm test

      - name: Import 4D results
        run: npm run import:4d

      - name: Verify all published 4D draws
        run: npm run verify:4d
